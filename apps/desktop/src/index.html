<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>Bunker</title>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/fields.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/lock.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/list.css">
  <link rel="stylesheet" href="styles/detail.css">
  <link rel="stylesheet" href="styles/states.css">
  <link rel="stylesheet" href="styles/toast.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <main class="screen lock" id="lockScreen">
    <div class="lock-stage enter">
      <section class="lock-card" id="lockCard" aria-labelledby="lockTitle">
        <img class="lock-logo" src="assets/logo.svg" width="84" height="84" alt="">
        <h1 class="wordmark" id="lockTitle">Bunker</h1>
        <p class="lock-sub">Digite a senha mestra para abrir o cofre.</p>
        <form id="lockForm" novalidate>
          <label class="label" for="masterPassword">Senha mestra</label>
          <div class="field" id="lockField">
            <span data-icon="lock"></span>
            <input id="masterPassword" type="password" autocomplete="current-password" spellcheck="false" aria-describedby="lockError" autofocus>
            <button class="icon-btn" id="revealLock" type="button" aria-label="Mostrar senha" aria-pressed="false"><span data-icon="eye"></span></button>
          </div>
          <p class="field-error" id="lockError" aria-live="polite"></p>
          <button class="btn primary block" type="submit">Desbloquear</button>
        </form>
      </section>
      <p class="lock-hint"><span>Atalho global</span><span class="keys" id="lockKeys"></span></p>
    </div>
  </main>

  <div class="screen app" id="vaultScreen" hidden>
    <a class="skip-link" href="#content">Ir para o conteúdo</a>
    <aside class="sidebar">
      <div class="brand"><img src="assets/logo.svg" width="32" height="32" alt=""><span class="brand-name">Bunker</span></div>
      <div class="side-scroll">
        <nav id="nav" aria-label="Categorias"></nav>
        <div class="soon" id="soonGroup" role="group" aria-labelledby="soonTitle">
          <h2 class="pill" id="soonTitle">Em breve</h2>
        </div>
      </div>
      <div class="sync-chip" id="syncChip" data-state="idle"><span class="dot" aria-hidden="true"></span><span id="syncText">Aguardando sincronização</span></div>
    </aside>

    <main class="main" id="content" tabindex="-1">
      <header class="topbar">
        <div class="field search" role="search">
          <span data-icon="search"></span>
          <label class="visually-hidden" for="searchInput">Buscar no cofre</label>
          <input id="searchInput" type="search" placeholder="Buscar no cofre" autocomplete="off" autocapitalize="off" spellcheck="false">
          <span class="keys" id="searchHint" aria-hidden="true"></span>
          <button class="icon-btn" id="searchClear" type="button" aria-label="Limpar busca" hidden><span data-icon="x"></span></button>
        </div>
        <button class="btn secondary" type="button" data-action="import"><span data-icon="upload"></span>Importar CSV</button>
        <button class="btn primary" type="button" data-action="sync"><span data-icon="refresh"></span><span class="spinner" aria-hidden="true"></span><span class="btn-label">Sincronizar Drive</span></button>
        <input id="csvFileInput" type="file" accept=".csv,text/csv" tabindex="-1" hidden>
      </header>

      <div class="content-head">
        <h1 id="viewTitle">Todos os itens</h1>
        <p class="meta" id="viewMeta" aria-live="polite">0 itens</p>
      </div>

      <div class="scroller" id="scroller">
        <div class="vault-list" id="vaultList"></div>

        <div class="state" id="emptyState">
          <div class="disc"><span data-icon="vault"></span></div>
          <h2>Seu cofre está vazio</h2>
          <p>Importe o arquivo passwords.csv ou sincronize com o Google Drive para trazer seus itens.</p>
          <div class="actions">
            <button class="btn secondary" type="button" data-action="import"><span data-icon="upload"></span>Importar CSV</button>
            <button class="btn primary" type="button" data-action="sync"><span data-icon="refresh"></span><span class="spinner" aria-hidden="true"></span><span class="btn-label">Sincronizar Drive</span></button>
          </div>
        </div>

        <div class="state" id="noResults" hidden>
          <div class="disc small"><span data-icon="search"></span></div>
          <h2>Nenhum resultado</h2>
          <p id="noText"></p>
          <button class="btn secondary" type="button" id="noReset" data-action="reset"></button>
        </div>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="renderer/dom.js"></script>
  <script src="renderer/icons.js"></script>
  <script src="renderer/text.js"></script>
  <script src="renderer/csv.js"></script>
  <script src="renderer/model.js"></script>
  <script src="renderer/state.js"></script>
  <script src="renderer/toast.js"></script>
  <script src="renderer/clipboard.js"></script>
  <script src="renderer/detail.js"></script>
  <script src="renderer/list.js"></script>
  <script src="renderer/sidebar.js"></script>
  <script src="renderer/view.js"></script>
  <script src="renderer/search.js"></script>
  <script src="renderer/sync.js"></script>
  <script src="renderer/actions.js"></script>
  <script src="renderer/lock.js"></script>
  <script src="renderer/app.js"></script>
</body>
</html>
