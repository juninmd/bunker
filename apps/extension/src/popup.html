<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Bunker</title>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/controls.css" />
    <link rel="stylesheet" href="styles/lock.css" />
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/items.css" />
    <link rel="stylesheet" href="styles/forms.css" />
    <link rel="stylesheet" href="styles/panels.css" />
  </head>
  <body>
    <div id="app" class="app" data-view="lock">
      <section id="view-lock" class="view view-lock" aria-labelledby="lock-title">
        <svg class="dial" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="dialGold" x1="14" y1="10" x2="106" y2="114" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffe9b4" />
              <stop offset=".46" stop-color="#f3bc4e" />
              <stop offset="1" stop-color="#c17d17" />
            </linearGradient>
            <linearGradient id="dialKnob" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffe3a0" />
              <stop offset=".55" stop-color="#f0b84c" />
              <stop offset="1" stop-color="#cf8e20" />
            </linearGradient>
            <radialGradient id="dialHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#f3bc4e" stop-opacity=".32" />
              <stop offset=".3" stop-color="#f3bc4e" stop-opacity=".18" />
              <stop offset=".6" stop-color="#f3bc4e" stop-opacity=".06" />
              <stop offset=".85" stop-color="#f3bc4e" stop-opacity=".012" />
              <stop offset="1" stop-color="#f3bc4e" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle cx="60" cy="62" r="64" class="dial-halo" />
          <circle cx="60" cy="62" r="46" class="dial-ring" />
          <g class="dial-face"><g id="dialTicks"></g></g>
          <path d="M60 14.5 55.2 5.5h9.6z" class="dial-marker" />
          <circle cx="60" cy="62" r="18" class="dial-knob" />
          <circle cx="60" cy="62" r="13.8" class="dial-knob-ring" />
          <circle cx="60" cy="59.8" r="4.2" class="dial-key" />
          <path d="M58.1 62.6h3.8l1.7 7.8h-7.2z" class="dial-key" />
        </svg>
        <h1 id="lock-title" class="wordmark">Bunker</h1>
        <p id="lockHint" class="lock-hint">Digite a senha mestra para abrir o cofre.</p>

        <form id="unlockForm" class="stack" novalidate>
          <label class="field-label" for="masterPassword">Senha mestra</label>
          <div class="input-row">
            <input id="masterPassword" type="password" autocomplete="current-password" required />
            <button type="button" class="icon-btn" data-reveal="masterPassword" aria-label="Mostrar senha"></button>
          </div>
          <div id="confirmRow" class="stack" hidden>
            <label class="field-label" for="masterConfirm">Repita a senha mestra</label>
            <input id="masterConfirm" type="password" autocomplete="new-password" />
          </div>
          <button id="unlockButton" class="btn primary block" type="submit">Abrir cofre</button>
        </form>

        <form id="pinForm" class="stack" hidden novalidate>
          <label class="field-label" for="pinInput">PIN rápido</label>
          <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" />
          <button class="btn ghost block" type="submit">Abrir com PIN</button>
        </form>

        <button id="unlockBiometricsBtn" class="btn ghost block" type="button" hidden>Abrir com biometria</button>

        <details id="recoveryBox" class="recovery">
          <summary>Esqueci a senha mestra</summary>
          <form id="recoveryForm" class="stack" novalidate>
            <label class="field-label" for="recoveryInput">Código de recuperação</label>
            <input id="recoveryInput" type="text" autocomplete="off" spellcheck="false" />
            <button class="btn ghost block" type="submit">Abrir com o código</button>
          </form>
        </details>
        <p class="lock-foot"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3" /></svg>Cifrado no seu dispositivo com AES-256-GCM</p>
      </section>

      <section id="view-vault" class="view" aria-label="Cofre" hidden>
        <header class="topbar">
          <label class="search">
            <span class="visually-hidden">Buscar no cofre</span>
            <input id="searchInput" type="search" placeholder="Buscar no cofre" autocomplete="off" />
          </label>
          <button id="newItemBtn" class="icon-btn accent" type="button" aria-label="Novo item"></button>
        </header>
        <nav id="folderChips" class="chips" aria-label="Pastas"></nav>
        <ul id="credentialList" class="item-list" aria-label="Itens do cofre"></ul>
      </section>

      <section id="view-editor" class="view" aria-labelledby="editorTitle" hidden>
        <header class="subbar">
          <button type="button" class="icon-btn" data-back aria-label="Voltar"></button>
          <h2 id="editorTitle">Novo item</h2>
        </header>
        <form id="credentialForm" class="editor stack" novalidate></form>
      </section>

      <section id="view-generator" class="view" aria-labelledby="generatorTitle" hidden>
        <header class="subbar"><h2 id="generatorTitle">Gerador</h2></header>
        <div id="generatorBody" class="pad stack"></div>
      </section>

      <section id="view-security" class="view" aria-labelledby="securityTitle" hidden>
        <header class="subbar"><h2 id="securityTitle">Saúde do cofre</h2></header>
        <div id="securityBody" class="pad stack"></div>
      </section>

      <section id="view-settings" class="view" aria-labelledby="settingsTitle" hidden>
        <header class="subbar"><h2 id="settingsTitle">Ajustes</h2></header>
        <div id="settingsBody" class="settings"></div>
      </section>

      <section id="view-panel" class="view" aria-labelledby="panelTitle" hidden>
        <header class="subbar">
          <button type="button" class="icon-btn" data-back aria-label="Voltar"></button>
          <h2 id="panelTitle"></h2>
        </header>
        <div id="panelBody" class="pad stack"></div>
      </section>

      <nav id="tabbar" class="tabbar" aria-label="Seções" hidden>
        <button type="button" data-tab="vault">Cofre</button>
        <button type="button" data-tab="generator">Gerador</button>
        <button type="button" data-tab="security">Saúde</button>
        <button type="button" data-tab="settings">Ajustes</button>
      </nav>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
