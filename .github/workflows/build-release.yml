name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and upload assets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Monorepo Dependencies (If Any)
        run: npm install || echo "No root package.json"

      - name: Build Extension
        run: |
          mkdir -p dist
          cd apps/extension
          npm ci || npm install
          npm run typecheck
          # Compress the extension directly into the dist directory
          zip -r ../../dist/drivepass-extension-${{ github.ref_name }}.zip . -x "tests/*" "node_modules/*" ".git/*" "package*.json" "tsconfig.json"

      - name: Build Desktop App
        run: |
          mkdir -p dist
          cd apps/desktop
          npm ci || npm install
          npx @electron/packager . DrivePass --platform=linux,win32,darwin --arch=x64 --out=../../dist --overwrite
          zip -r ../../dist/drivepass-desktop-${{ github.ref_name }}.zip ../../dist/DrivePass-*


      - name: Build Android APK
        run: |
          mkdir -p dist
          cd apps/android
          npm ci || npm install
          npm run build:apk
          cp dist/*.apk ../../dist/drivepass-android-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
